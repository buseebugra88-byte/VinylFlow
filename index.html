<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plak Çalarım</title>
<meta name="theme-color" content="#1c1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plak Çalarım">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  :root {
    --bg: #1c1612;
    --wood1: #6b4026;
    --wood2: #4a2a18;
    --cream: #f3e7d3;
    --brass: #c9a25b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #2e241d, var(--bg) 70%);
    color: var(--cream);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 40px; gap: 28px;
  }
  h1 { font-weight: normal; letter-spacing: .08em; font-size: 26px; }
  h1 small { display: block; font-size: 13px; opacity: .6; letter-spacing: .03em; margin-top: 4px; text-align: center; }

  /* ---------- turntable ---------- */
  .deck {
    position: relative;
    width: min(560px, 94vw); aspect-ratio: 1.3;
    border-radius: 18px;
    background:
      repeating-linear-gradient(92deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px),
      linear-gradient(160deg, var(--wood1), var(--wood2));
    box-shadow: 0 25px 50px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12);
    padding: 6%;
  }
  .plate {
    position: absolute; left: 6%; top: 8%;
    width: 62%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, #3a3a3a 0 60%, #222 61% 100%);
    box-shadow: inset 0 0 0 6px #555, 0 6px 14px rgba(0,0,0,.5);
  }
  .vinyl {
    position: absolute; inset: 3%; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 31%, rgba(255,255,255,.05) 31.5% 32%, transparent 32.5%),
      repeating-radial-gradient(circle, #111 0 1.5px, #1b1b1b 1.5px 3px);
    box-shadow: 0 0 0 1px #000;
    opacity: 0; transform: translateX(120%) scale(.9);
    transition: transform .7s cubic-bezier(.3,.8,.3,1), opacity .4s;
  }
  .vinyl::after { /* shine */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 30deg, transparent 0 15%, rgba(255,255,255,.10) 20%, transparent 26% 65%, rgba(255,255,255,.08) 70%, transparent 76%);
  }
  .vinyl.on { opacity: 1; transform: none; }
  .vinyl.spin { animation: spin 1.8s linear infinite; }
  .label {
    position: absolute; inset: 33%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: clamp(9px, 1.8vw, 13px); line-height: 1.2; padding: 8%;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .label::after { /* spindle */
    content: ""; position: absolute; width: 7%; height: 7%; border-radius: 50%;
    background: #ddd; left: 46.5%; top: 46.5%;
  }
  .label span { transform: translateY(-38%); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .arm {
    position: absolute; right: 13%; top: 10%;
    width: 4%; height: 62%;
    transform-origin: 50% 6%;
    transform: rotate(-4deg);
    transition: transform 1.1s ease-in-out;
  }
  .arm.down { transform: rotate(22deg); }
  .arm .pivot {
    position: absolute; left: 50%; top: 0; width: 260%; aspect-ratio: 1; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(circle, #eee, #888); box-shadow: 0 3px 6px rgba(0,0,0,.5);
  }
  .arm .rod {
    position: absolute; left: 35%; top: 5%; width: 30%; height: 88%;
    background: linear-gradient(90deg, #888, #eee, #888); border-radius: 4px;
  }
  .arm .head {
    position: absolute; left: -20%; bottom: 0; width: 140%; height: 12%;
    background: linear-gradient(#333, #111); border-radius: 3px; transform: rotate(18deg);
  }

  .panel {
    position: absolute; right: 6%; bottom: 8%;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px; width: 30%;
  }
  .now { font-size: 14px; opacity: .85; text-align: center; min-height: 2.6em; margin-top: -10px; }
  .now b { display: block; font-size: 20px; color: var(--brass); }
  .btn {
    font: inherit; font-size: 14px; cursor: pointer;
    background: var(--brass); color: #2a1a0e; border: 0; border-radius: 999px;
    padding: 9px 16px; box-shadow: 0 3px 0 #8a6a30;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6a30; }
  .btn[disabled] { opacity: .35; cursor: default; }
  .btn.ghost { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1px rgba(243,231,211,.4); }
  .led { width: 9px; height: 9px; border-radius: 50%; background: #3a2a20; position: absolute; left: 4%; bottom: 6%; }
  .led.on { background: #ff6a3d; box-shadow: 0 0 10px #ff6a3d; }

  /* ---------- crate of records ---------- */
  .shelf-title { font-size: 14px; opacity: .6; letter-spacing: .1em; text-transform: uppercase; }
  .crate {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 18px; width: min(820px, 94vw);
  }
  .sleeve {
    position: relative; aspect-ratio: 1; cursor: pointer;
    border: 0; border-radius: 4px; color: #fff; font: inherit;
    box-shadow: 0 8px 16px rgba(0,0,0,.45);
    transition: transform .2s;
    overflow: hidden; text-align: left; padding: 10px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .sleeve:hover { transform: translateY(-6px) rotate(-1deg); }
  .sleeve.playing { outline: 2px solid var(--brass); outline-offset: 3px; }
  .sleeve .disc {
    position: absolute; right: -35%; top: 10%; width: 80%; aspect-ratio: 1; border-radius: 50%;
    background: repeating-radial-gradient(circle, #111 0 1.5px, #1d1d1d 1.5px 3px);
    transition: right .3s; z-index: 0;
  }
  .sleeve:hover .disc { right: -20%; }
  .sleeve .art { position: absolute; inset: 0; z-index: 1; }
  .sleeve .t { position: relative; z-index: 2; font-size: 15px; line-height: 1.15; }
  .sleeve .s { position: relative; z-index: 2; font-size: 11px; opacity: .8; }
  .sleeve .del {
    position: absolute; z-index: 3; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 14px; line-height: 22px; cursor: pointer;
    opacity: 0; transition: opacity .2s;
  }
  .sleeve:hover .del, .sleeve:focus-within .del { opacity: 1; }
  .sleeve.add {
    background: transparent; box-shadow: none; border: 2px dashed rgba(243,231,211,.35);
    color: var(--cream); align-items: center; justify-content: center; text-align: center; gap: 6px;
  }
  .sleeve.add:hover { border-color: var(--brass); color: var(--brass); }
  .sleeve.add .plus { font-size: 34px; line-height: 1; }
</style>
</head>
<body>

<h1>Plak Çalarım<small>Bir plak seç, iğneyi indir, müzik çalsın</small></h1>

<div class="deck">
  <div class="plate">
    <div class="vinyl" id="vinyl"><div class="label" id="label"><span id="labelText"></span></div></div>
  </div>
  <div class="arm" id="arm"><div class="rod"></div><div class="head"></div><div class="pivot"></div></div>
  <div class="panel">
    <button class="btn" id="play" disabled>▶ Çal</button>
    <button class="btn ghost" id="eject" disabled>⏏ Çıkar</button>
  </div>
  <div class="led" id="led"></div>
</div>

<div class="now" id="now">Plak yok</div>

<div class="shelf-title">Plak kutusu</div>
<div class="crate" id="crate"></div>

<input type="file" id="file" accept="audio/*" multiple hidden>
<audio id="audio"></audio>

<script>
const $ = id => document.getElementById(id);
const vinyl = $("vinyl"), arm = $("arm"), led = $("led"), audio = $("audio"), crate = $("crate");
let records = [], current = null, playing = false, busy = false, objectUrl = null;

/* ---------- saklama (bu tarayıcıda kalır) ---------- */
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open("plak-calarim", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("plaklar", { keyPath: "id" });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function tx(mode, fn) {
  const db = await dbReady;
  return new Promise((res, rej) => {
    const t = db.transaction("plaklar", mode), st = t.objectStore("plaklar");
    const out = fn(st);
    t.oncomplete = () => res(out && out.result);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx("readonly", st => st.getAll());
const dbPut = rec => tx("readwrite", st => st.put(rec));
const dbDel = id  => tx("readwrite", st => st.delete(id));

/* ---------- plak kutusu ---------- */
function colors(hue) {
  return { color: `hsl(${hue} 45% 38%)`, art: `linear-gradient(135deg, hsl(${hue} 45% 42%), hsl(${hue} 50% 18%))` };
}
function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

function render() {
  crate.innerHTML = "";
  const add = document.createElement("button");
  add.className = "sleeve add";
  add.innerHTML = `<div class="plus">+</div><div>Plak ekle</div>`;
  add.onclick = () => $("file").click();
  crate.appendChild(add);

  records.forEach(r => {
    const c = colors(r.hue);
    const b = document.createElement("div");
    b.className = "sleeve" + (current && current.id === r.id ? " playing" : "");
    b.tabIndex = 0;
    b.innerHTML = `<div class="disc"></div><div class="art" style="background:${c.art}"></div>
                   <div class="t">${esc(r.title)}</div><div class="s">${esc(r.type)}</div>
                   <button class="del" title="Plağı sil">×</button>`;
    b.onclick = () => load(r);
    b.onkeydown = e => { if (e.key === "Enter") load(r); };
    b.querySelector(".del").onclick = async e => {
      e.stopPropagation();
      if (!confirm(`"${r.title}" plağı silinsin mi?`)) return;
      if (current && current.id === r.id) await eject();
      await dbDel(r.id);
      records = records.filter(x => x.id !== r.id);
      render();
    };
    crate.appendChild(b);
  });
}

$("file").onchange = async e => {
  for (const f of e.target.files) {
    const rec = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2),
      title: f.name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " "),
      type: (f.name.split(".").pop() || "ses").toUpperCase(),
      hue: Math.floor(Math.random() * 360),
      blob: f,
      added: Date.now(),
    };
    try { await dbPut(rec); } catch (err) { alert("Bu şarkı kaydedilemedi: " + f.name); continue; }
    records.push(rec);
  }
  e.target.value = "";
  render();
};

/* ---------- plak çalar ---------- */
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function setPlaying(on) {
  playing = on;
  arm.classList.toggle("down", on);
  vinyl.classList.toggle("spin", on);
  led.classList.toggle("on", on);
  $("play").textContent = on ? "⏸ Duraklat" : "▶ Çal";
}

async function eject() {
  audio.pause();
  setPlaying(false);
  await wait(500);
  vinyl.classList.remove("on");
  await wait(500);
  current = null;
  if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  audio.removeAttribute("src");
  $("now").textContent = "Plak yok";
  $("play").disabled = $("eject").disabled = true;
  render();
}

async function load(r) {
  if (busy || (current && current.id === r.id)) return;
  busy = true;
  if (current) await eject();
  current = r;
  const c = colors(r.hue);
  $("label").style.background = c.color;
  $("labelText").textContent = r.title;
  objectUrl = URL.createObjectURL(r.blob);
  audio.src = objectUrl;
  render();
  vinyl.classList.add("on");
  await wait(700);
  $("now").innerHTML = `<b>${esc(r.title)}</b>çalmaya hazır`;
  $("play").disabled = $("eject").disabled = false;
  busy = false;
}

$("play").onclick = async () => {
  if (!current || busy) return;
  if (playing) { audio.pause(); setPlaying(false); return; }
  busy = true;
  setPlaying(true);
  await wait(1100);              // iğne inene kadar bekle
  $("now").innerHTML = `<b>${esc(current.title)}</b>çalıyor`;
  try { await audio.play(); } catch (err) { setPlaying(false); alert("Bu dosya çalınamadı."); }
  busy = false;
};
audio.onended = () => { setPlaying(false); if (current) $("now").innerHTML = `<b>${esc(current.title)}</b>bitti`; };
audio.onpause = () => { if (playing && !busy) setPlaying(false); };
$("eject").onclick = () => { if (!busy) { busy = true; eject().then(() => busy = false); } };

dbAll().then(all => { records = (all || []).sort((a, b) => a.added - b.added); render(); })
       .catch(() => render());
</script>
</body>
</html>
